message ReportContentRequest {
  string octoObjectId = 1;
  repeated ReportReasonCode reasonCodes = 2;
  optional string customReason = 3;
}

message ReportContentResponse {
}

message GetOrCreateBridgePostRequest {
  optional string clientToken = 1;//Better to fill it for security reasons
  optional string topicId = 2;//Default bridge topic if not filled
  Post postBridge = 3;// must contain bridgeToClientObject
}

message GetOrCreateBridgePostResponse {
  oneof result {
    Success success = 1;
    Fail fail = 2;
  }
  message Success {
    OctoObject postBridge = 1; // The created post
    Aggregate aggregate = 3; // The aggregate for the created post

    optional ResponseStatus status = 2; // Used for analytics only
    enum ResponseStatus {
      UNKNOWN = 0;
      CREATED = 1; //Post bridge created
      RETRIEVED = 2; //Existing post bridge retrieved
    }
  }
  message Fail {
    repeated Error errors = 1;
  }
  message Error {
    string message = 1;

    optional Field field = 2;
    enum Field {
      UNKNOWN = 0; // InvalidClientToken, ExpiredClientToken
      CONTENT_TEXT = 1; //MissingText, MaxCharLimitReached
      CONTENT_FILE = 2; //EmptyFile, FileSizeTooBig, BadFileFormat, UploadIssue, DownloadIssue
      CONTENT_CLIENT_OBJECT = 3; //MissingCtaText, MissingClientObjectId, BridgePostUnavailable, InvalidTopicIc, InvalidAuthor, PostAlreadyExists
    }

    optional int32 fileIndex = 3;

    oneof details {
      ErrorDetails.MissingText missingText = 101;
      ErrorDetails.MaxCharLimitReached maxCharLimitReached = 102;
      ErrorDetails.EmptyFile emptyFile = 103;
      ErrorDetails.FileSizeTooBig fileSizeTooBig = 104;
      ErrorDetails.BadFileFormat badFileFormat = 105;
      ErrorDetails.UploadIssue uploadIssue = 106;
      ErrorDetails.DownloadIssue downloadIssue = 107;
      ErrorDetails.MissingCtaText missingCtaText = 108;
      ErrorDetails.MissingClientObjectId missingClientObjectId = 109;
      ErrorDetails.InvalidClientToken invalidClientToken = 110;
      ErrorDetails.BridgePostUnavailable bridgePostUnavailable = 111;
      ErrorDetails.ExpiredClientToken expiredClientToken = 112;
      ErrorDetails.InvalidTopicId invalidTopicId = 113;
      ErrorDetails.InvalidAuthor invalidAuthor = 114;
      ErrorDetails.PostAlreadyExists postAlreadyExists = 115; //Only on GetBridgePost service call
      ErrorDetails.PostNotFound postNotFound = 116; //Only on GetBridgePost service call
    }
  }
}

message GetBridgePostRequest {
    string clientObjectId = 1;
}

message GetOctoObjectTranslationsRequest {
  string octoObjectId = 1;
}

message GetOctoObjectTranslationsResponse {
  string octoObjectId = 1;
  optional string originalLanguageCode = 2; // Can be null if not detected
  repeated FieldTranslationsByLanguage fieldTranslationsByLanguages = 3;
}

message FieldTranslationsByLanguage {
  string translationLanguageCode = 1;
  FieldTranslations text = 2;
  repeated FieldTranslations pollAnswers = 3;
  optional FieldTranslations ctaButton = 4;
  optional FieldTranslations catchPhrase = 5;
}

message FieldTranslations {
  string originalText = 1;
  string translatedText = 2;
}
