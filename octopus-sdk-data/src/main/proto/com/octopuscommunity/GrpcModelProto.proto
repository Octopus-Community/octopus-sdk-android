syntax = "proto3";

package com.octopuscommunity;

//normalized OctoObject
message OctoObject {
  string parentId = 1;
  uint64 createdAt = 2;
  uint64 updatedAt = 7;
  uint64 pressedEnterAt = 6;
  optional MinimalProfile createdBy = 3; //Empty when user is deleted or banned
  string id = 4; //nanoId

  Content content = 5;

  Status status = 20;
  //To fetch post comments
  //Or comment replies
  optional string descChildrenFeedId = 10;
  optional string ascChildrenFeedId = 11;

  message Status {
    StatusValue value = 1;
    repeated StatusReason reasons = 2;
  }

  optional string metadata = 999; //JSON string

}

message RequesterCtx {
  optional string likeId = 1; //If the requester liked the object
  optional string pollAnswerId = 2; //If the user voted on poll
  optional ReactionCtx reactionCtx = 3; //If the user reacted on the object
  optional bool canAccess = 4; //false if the requester lacks the access entitlement for this object.
  optional bool canCreateChildren = 5; //false if canAccess is false, or if user is missing creation entitlement
}

message ReactionCtx {
  string reactionId = 1;
  string unicode = 2;
}

enum StatusValue {
  UNKNOWN = 0;
  PUBLISHED = 1;
  MODERATED = 2;
}
message StatusReason {
  StatusReasonCode code = 1;
  string message = 2;
}
enum StatusReasonCode {
  UNSPECIFIED_REASON = 0;
  HTE = 1;//Hateful Conduct
  HRS = 2;//Bullying or Harassment
  GV = 3;//Graphic Violence
  AGG = 4;//Aggressive
  VLC = 5;//Violent Instigation
  SXC = 6;//Sexually Suggestive
  NUD = 7;//Adult Nudity or Sexual Activity
  SOLI = 8;//Sexual Solicitation or Explicit Language
  AEX = 9;//Adult Sexual Exploitation
  CEX = 10;//Child Sexual Abuse Material
  SSH = 11;//Suicide or Self-harm
  ILL = 12;//Regulated Goods
  HEX = 13;//Human Exploitation
  TER = 14;//Terrorism, Organized Hate, Dangerous Organizations or Individual
  HC = 15;//Harm or Crime
  SPM = 16;//Spam or Scams
  IMP = 17;//Impersonation
  MIS = 18;//Misinformation
  PII = 19;//Personally Identifiable Information
  UP = 20;//Username Policy
  CIP = 21;//Copyright or Intellectual Property Infringement
  OTH = 9999;//Other
}

enum ReportReasonCode {
  REPORT_UNSPECIFIED_REASON = 0;
  REPORT_HTE_HRS = 1;//Hate speech, discrimination, and harassment
  REPORT_SXC = 2;//Explicit or inappropriate content
  REPORT_VLC_TER = 3;//Violence and terrorism
  REPORT_SPM = 4;//Spam and scams
  REPORT_SSH = 5;//Suicide and self-harm
  REPORT_IMP = 6;//Deprecated. Fake profiles and impersonation — fake profiles now belong to REPORT_SPM. Kept for old SDKs.
  REPORT_CEX = 7;//Child exploitation or abuse
  REPORT_IPV = 8;//Intellectual property violation
  REPORT_ILL = 9;//Illegal activities or products
  REPORT_OTH = 9999;//Other
}

message Aggregate {
  uint32 childrenCount = 1;
  uint64 childrenLatestAddedAt = 2;
  uint32 likeCount = 3;//Deprecated. Use reactionData
  uint32 viewCount = 4;
  optional PollResult pollResult = 5;
  repeated ReactionData reactions = 6;
}

message PollResult {
  repeated PollAnswerResult answerResults = 1;
  uint32 totalVoteCount = 2;
}

message PollAnswerResult {
  string pollAnswerId = 1;
  uint32 voteCount = 2;
}

message ReactionData {
  string unicode = 1;
  uint32 count = 2;
}

message MinimalProfile {
  string profileId = 1;
  string nickname = 2;
  optional string avatarUrl = 3;
  repeated ProfileTag tags = 4;
  optional int32 gamificationLevel = 5;
  optional string clientUserId = 6; //The user's id in the client's own system. Absent when the community does not expose client user ids, or the user has none.
  optional DefaultAvatar defaultAvatar = 7;
}

// What to draw for a member who has no picture of their own, chosen by the community.
// Set by the server only when the member has no picture AND the community uses its own colors or
// images. Absent otherwise: keep your current fallback (initials on a color computed by the app).
// When present, draw it instead of avatarUrl / pictureUrl: the member has no picture, so those hold at
// most a copy of the default image, made for older app versions. Colors are never copied.
message DefaultAvatar {
  oneof kind {
    // Draw the member's initials, in initialsHex, on backgroundHex.
    DefaultAvatarColor color = 1;
    // Draw this image like a profile picture. Square JPEG, 256x256. Immutable: a new image always
    // gets a new URL, and the file name (last path segment) is unique across communities.
    string imageUrl = 2;
  }
}

message DefaultAvatarColor {
  string backgroundHex = 1; // Always "#RRGGBB": 7 characters, uppercase hex, no alpha.
  string initialsHex = 2;   // "internal change" or "#FFFFFF", chosen by the server for contrast.
}

enum ProfileTag {
  UNDEFINED = 0;
  ADMIN = 1;
}

message Content {
  //Only one of the following should be set
  //I don't use oneof because it's just syntactic sugar, and don't throw error if multiple fields are set (it keep the last one)
  optional Section section = 100;
  optional Topic topic = 101;
  optional Post post = 102;
  optional Comment comment = 103;
  optional Reply reply = 104;

  optional Channel channel = 201;
  optional Message message = 202;

  optional Like like = 300; //Deprecated. Use Reaction instead
  optional Reaction reaction = 301;

  optional PollVote vote = 400;
}

message Like {}

message Reaction {
  string unicode = 1; //Can be ❤️,😂,😮,👏,😢,😡
}

message PollVote {
  string pollAnswerId = 1;
}

/* Channel handling */

message Channel {
  string name = 1;
  string description = 2;
  //string imgUrl = 3;
  //Children should be Message
}

message Message {
  string text = 1;
  repeated Image medias = 2;
}

/* Topic handling */

message Topic {
  string name = 1;
  string description = 2;
  //string imgUrl = 4;
  repeated string sectionIds = 5;
  FollowStatus followStatus = 10;
  optional CTA cta = 11;
  //Children should be Post

  enum FollowStatus {
    UNSPECIFIED_FOLLOW_STATUS = 0;
    TOPIC_FOLLOWED = 1;
    TOPIC_NOT_FOLLOWED = 2;
    TOPIC_FORCE_FOLLOWED = 3; // cannot be unfollowed
    TOPIC_FORCE_NOT_FOLLOWED = 4; // cannot be followed
  }
}

message Section {
  string label = 1; //Translated
}

/* Media handling */

message StrictMedia {
  repeated Image images = 1; //Carousel
  optional Image deprecatedVideo = 2 [deprecated = true]; //Not used anymore
  optional MediaContent video = 3; //Video
}

message Image {
  oneof file {
    string url = 1;
    bytes bytes = 4;
    string uploadId = 8;
  }
  string name = 2;
  string contentType = 3;
  optional int32 width = 5;
  optional int32 height = 6;
  optional bool isOptimized = 7; //True if sdk resized the file before uploading it. Skip backend resize process if true
}

message Poll {
  repeated PollAnswer answers = 1; // Maximum 7
}

message BridgeToClientObject {
  string clientObjectId = 1;
  optional string catchPhrase = 2;
  optional CTA cta = 3;
  optional string translatedCatchPhrase = 4;//Returned if language header value <> original language and translation exist (in requested language or default english)
}

message CTA {
  string text = 1;
  optional string translatedText = 2;//Returned if language header value <> original language and translation exist (in requested language or default english)
  optional string targetLink = 3; // Empty when used for bridge
  optional string textLanguage = 4; // Write-only, ignored on Topic.cta: language of text, `language[-Script][-REGION]`
  map<string, string> textTranslations = 5; // Write-only, ignored on Topic.cta: other labels by language code, textLanguage excluded
}

message PollAnswer {
  optional string id = 1; //API should fill it on put
  string text = 2; //Max length 100
  optional string translatedText = 3;//Returned if language header value <> original language and translation exist (in requested language or default english)
}

message Post {
  //Children should be Comment
  string text = 1;
  // field 2 was "optional string text = 2;", now removed.
  optional StrictMedia media = 3;
  optional Poll poll = 4; //Either poll or media. Not a oneOf to manage retro compatibility
  optional BridgeToClientObject bridgeToClientObject = 5;
  optional string translatedText = 20;//Returned if language header value <> original language and translation exist (in requested language or default english)
  optional string originalLanguage = 21;
  optional string translatedLanguage = 22;
  optional CTA cta = 30;
  optional EntitlementList createCommentsRepliesOverride = 31;
}

message Comment {
  //Children should be Reply
  string text = 1;
  StrictMedia media = 2;
  optional string translatedText = 20;//Returned if language header value <> original language and translation exist (in requested language or default english)
  optional string originalLanguage = 21;
  optional string translatedLanguage = 22;
}

message Reply {
  string text = 1;
  StrictMedia media = 2;
  optional string translatedText = 20;//Returned if language header value <> original language and translation exist (in requested language or default english)
  optional string originalLanguage = 21;
  optional string translatedLanguage = 22;
}

message Notification {
  string id = 1;
  repeated NotificationThumbnail notificationThumbnails = 2;
  oneof text {
    string md = 3;
    string raw = 4;
  }
  optional Action action = 5;
  bool read = 6;
  uint64 updatedAt = 7;

  message Action {
    repeated LinkToOctoObject link = 1; // order by display order

    message LinkToOctoObject {
      string octoObjectId = 1;
      ContentEntity content = 2;
    }

    enum ContentEntity {
      UNDEFINED = 0;
//      TOPIC = 1;
      POST = 2;
      COMMENT = 3;
      REPLY = 4;
    }
  }

  message NotificationThumbnail {
    optional MinimalProfile profile = 1;
  }
}

// Media

message EntitlementList {
  repeated string entitlements = 1;
}

message MediaContent {
  string id = 1;
  optional MediaData data = 2;
  optional MediaStatus status = 3;
  optional string errorMessage = 4;

  enum MediaStatus {
    UNDEFINED = 0;
    SUCCESS = 1;
    IN_PROGRESS = 2;
    FAIL = 3;
    NOT_FOUND = 4;
  }
}

message MediaData {
  oneof data {
    VideoData videoData = 10;
  }
}

message VideoData {
  string url = 1;
  optional string thumbnailUrl = 2;
  optional int32 width = 3;
  optional int32 height = 4;
  optional int64 durationMs = 5;
}
